title: Energy Analyzer
views:
  - type: sections
    title: Home
    path: overview
    icon: mdi:home-lightning-bolt
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-house-flow
            title: Home energy summary
            setup_health_entity: sensor.circuitsetup_energy_analyzer_setup_health
            setup_health_path: /circuitsetup-energy-analyzer-evidence?setup_health=1
            primary_mains:
              circuit_id: mains
              name: Mains
              power_entities:
                - sensor.mains_power
              daily_energy_usage_entity: sensor.mains_daily_energy_usage
              cost_today_entity: sensor.mains_cost_today
              monitored_power_entity: sensor.mains_monitored_power
              balance_power_entity: sensor.mains_balance_power
              monitored_coverage_entity: sensor.mains_monitored_coverage
              nilm_unknown_loads_entity: sensor.mains_nilm_unknown_loads
              solar_flow_status_entity: sensor.mains_solar_flow_status
              solar_surplus_power_entity: sensor.mains_solar_surplus_power
              utility_comparison_status_entity: sensor.mains_utility_comparison_status
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                area: Kitchen
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=refrigerator
                power_entities:
                  - sensor.refrigerator_power
                running_entity: binary_sensor.refrigerator_running
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                health_entity: sensor.refrigerator_health_summary
              - circuit_id: hvac
                name: HVAC
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=hvac
                power_entities:
                  - sensor.hvac_power
                running_entity: binary_sensor.hvac_running
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                health_entity: sensor.hvac_health_summary

  - type: sections
    title: Appliances
    path: appliances
    icon: mdi:devices
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-appliance-grid
            title: Appliances
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                area: Kitchen
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=refrigerator
                power_entities:
                  - sensor.refrigerator_power
                running_entity: binary_sensor.refrigerator_running
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                health_entity: sensor.refrigerator_health_summary
              - circuit_id: hvac
                name: HVAC
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=hvac
                power_entities:
                  - sensor.hvac_power
                running_entity: binary_sensor.hvac_running
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                health_entity: sensor.hvac_health_summary

  - type: sections
    title: Energy & Costs
    path: energy-costs
    icon: mdi:chart-bar
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-energy-cost
            title: Energy and costs
            api_path: circuitsetup_energy_analyzer/appliance_insights
            primary_mains:
              circuit_id: mains
              name: Mains
              daily_energy_usage_entity: sensor.mains_daily_energy_usage
              cost_today_entity: sensor.mains_cost_today
              average_kwh_per_day_entity: sensor.mains_average_kwh_per_day
              average_cost_per_day_entity: sensor.mains_average_cost_per_day
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                average_kwh_entity: sensor.refrigerator_average_kwh_per_day
                average_cost_entity: sensor.refrigerator_average_cost_per_day
              - circuit_id: hvac
                name: HVAC
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                average_kwh_entity: sensor.hvac_average_kwh_per_day
                average_cost_entity: sensor.hvac_average_cost_per_day
          - type: entities
            title: Billing Cycle
            entities:
              - entity: sensor.mains_billing_cycle_usage
                name: Usage
              - entity: sensor.mains_cost_cycle
                name: Cost so far
              - entity: sensor.mains_cost_cycle_forecast
                name: Projected cost

  - type: sections
    title: Mains & NILM
    path: mains-nilm
    icon: mdi:transmission-tower
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-house-flow
            mode: mains
            title: Mains and NILM
            primary_mains:
              circuit_id: mains
              name: Mains
              power_entities:
                - sensor.mains_power
              monitored_power_entity: sensor.mains_monitored_power
              balance_power_entity: sensor.mains_balance_power
              monitored_coverage_entity: sensor.mains_monitored_coverage
              nilm_unknown_loads_entity: sensor.mains_nilm_unknown_loads
              nilm_signature_count_entity: sensor.mains_nilm_signature_count
              solar_surplus_power_entity: sensor.mains_solar_surplus_power
          - type: custom:circuitsetup-energy-analyzer-dashboard-graphs
            title: Defined NILM appliance power
            circuit_id: mains
            detail_path: /circuitsetup-energy-analyzer-evidence?nilm_workspace=1&circuit_id=mains
          - type: button
            name: Review NILM Assignments
            icon: mdi:playlist-check
            tap_action:
              action: navigate
              navigation_path: /circuitsetup-energy-analyzer-evidence?nilm_workspace=1&circuit_id=mains

  - type: sections
    title: Insights
    path: insights
    icon: mdi:lightbulb-on-outline
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: history-graph
            title: HVAC activity and outdoor temperature
            hours_to_show: 168
            entities:
              - entity: sensor.outdoor_temperature
                name: Outdoor temperature
              - entity: sensor.hvac_power
                name: HVAC power
              - entity: binary_sensor.hvac_running
                name: HVAC running
              - entity: sensor.hvac_daily_energy_usage
                name: HVAC energy today
