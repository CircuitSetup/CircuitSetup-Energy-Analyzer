type: sections
title: Energy Analyzer
sections:
  - type: grid
    title: At a glance
    cards:
      - type: glance
        title: At a glance
        columns: 3
        entities:
          - entity: sensor.refrigerator_health_summary
            name: Refrigerator
          - entity: sensor.hvac_health_summary
            name: HVAC
          - entity: sensor.mains_nilm_health_summary
            name: Mains
          - entity: sensor.refrigerator_learning_progress
            name: Fridge learning
          - entity: sensor.hvac_learning_progress
            name: HVAC learning
          - entity: sensor.mains_nilm_learning_progress
            name: Mains learning
      - type: gauge
        title: Refrigerator anomaly
        entity: sensor.refrigerator_anomaly_score
        min: 0
        max: 1
        severity:
          green: 0
          yellow: 0.35
          red: 0.7
      - type: gauge
        title: HVAC anomaly
        entity: sensor.hvac_anomaly_score
        min: 0
        max: 1
        severity:
          green: 0
          yellow: 0.35
          red: 0.7
      - type: gauge
        title: Mains coverage
        entity: sensor.mains_nilm_monitored_coverage
        min: 0
        max: 100
        severity:
          red: 0
          yellow: 50
          green: 80
  - type: grid
    title: Recent behavior
    cards:
      - type: history-graph
        title: Anomaly trend
        hours_to_show: 24
        entities:
          - entity: sensor.refrigerator_anomaly_score
          - entity: sensor.hvac_anomaly_score
          - entity: sensor.mains_nilm_anomaly_score
      - type: history-graph
        title: Daily energy
        hours_to_show: 72
        entities:
          - entity: sensor.refrigerator_daily_energy_usage
          - entity: sensor.hvac_daily_energy_usage
      - type: entities
        title: Latest evidence
        entities:
          - entity: sensor.refrigerator_alert_evidence
          - entity: sensor.refrigerator_recent_activity
          - entity: sensor.hvac_alert_evidence
          - entity: sensor.hvac_recent_activity
          - entity: sensor.mains_nilm_alert_evidence
          - entity: sensor.mains_nilm_recent_activity
  - type: grid
    title: Power quality
    cards:
      - type: gauge
        title: Refrigerator power quality
        entity: sensor.refrigerator_power_quality_score
        min: 0
        max: 1
        severity:
          green: 0
          yellow: 0.35
          red: 0.7
      - type: gauge
        title: HVAC power quality
        entity: sensor.hvac_power_quality_score
        min: 0
        max: 1
        severity:
          green: 0
          yellow: 0.35
          red: 0.7
      - type: entities
        title: Refrigerator power evidence
        entities:
          - entity: sensor.refrigerator_power_quality_evidence
          - entity: sensor.refrigerator_reactive_power_drift
          - entity: sensor.refrigerator_apparent_power_drift
          - entity: sensor.refrigerator_power_factor_drift
      - type: entities
        title: HVAC power evidence
        entities:
          - entity: sensor.hvac_power_quality_evidence
          - entity: sensor.hvac_reactive_power_drift
          - entity: sensor.hvac_apparent_power_drift
          - entity: sensor.hvac_power_factor_drift
          - entity: sensor.hvac_metric_consistency_status
  - type: grid
    title: HVAC and demand
    cards:
      - type: gauge
        title: HVAC demand limit
        entity: sensor.hvac_demand_limit_usage
        min: 0
        max: 120
        severity:
          green: 0
          yellow: 75
          red: 100
      - type: gauge
        title: HVAC capacity
        entity: sensor.hvac_capacity_usage
        min: 0
        max: 120
        severity:
          green: 0
          yellow: 80
          red: 100
      - type: entities
        title: HVAC detail
        entities:
          - entity: sensor.hvac_current_demand
          - entity: sensor.hvac_peak_demand
          - entity: sensor.hvac_demand_peak_status
          - entity: sensor.hvac_leg_imbalance_status
          - entity: sensor.hvac_run_cycle_status
  - type: grid
    title: Energy usage
    cards:
      - type: gauge
        title: Refrigerator usage share
        entity: sensor.refrigerator_energy_usage_share
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 25
          red: 40
      - type: entities
        title: Refrigerator usage
        entities:
          - entity: sensor.refrigerator_daily_energy_usage
          - entity: sensor.refrigerator_energy_usage_status
          - entity: sensor.refrigerator_standby_status
          - entity: sensor.refrigerator_always_on_power
  - type: grid
    title: Mains and NILM
    cards:
      - type: glance
        title: Mains NILM
        columns: 3
        entities:
          - entity: sensor.mains_nilm_nilm_discovered_signatures
            name: Signatures
          - entity: sensor.mains_nilm_nilm_unmatched_load_percentage
            name: Unmatched
          - entity: sensor.mains_nilm_balance_status
            name: Balance
          - entity: sensor.mains_nilm_monitored_coverage
            name: Coverage
          - entity: sensor.mains_nilm_demand_peak_status
            name: Peak
          - entity: sensor.mains_nilm_readiness
            name: Readiness
      - type: history-graph
        title: Mains power balance
        hours_to_show: 24
        entities:
          - entity: sensor.mains_nilm_balance_power
          - entity: sensor.mains_nilm_monitored_power
      - type: entities
        title: NILM review
        entities:
          - entity: sensor.mains_nilm_alert_evidence
          - entity: sensor.mains_nilm_recent_activity
          - entity: sensor.mains_nilm_nilm_topology_status
          - entity: binary_sensor.mains_nilm_maintenance
