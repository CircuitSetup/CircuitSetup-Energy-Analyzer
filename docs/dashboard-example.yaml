type: sections
title: Energy Analyzer
sections:
  - type: grid
    title: Setup health
    cards:
      - type: entities
        title: Overall readiness
        entities:
          - entity: sensor.refrigerator_health_summary
          - entity: sensor.refrigerator_readiness
          - entity: sensor.hvac_health_summary
          - entity: sensor.hvac_readiness
          - entity: sensor.mains_health_summary
          - entity: sensor.mains_readiness
      - type: entities
        title: Data quality
        entities:
          - entity: sensor.refrigerator_data_quality_checklist
          - entity: binary_sensor.refrigerator_data_quality_problem
          - entity: sensor.hvac_data_quality_checklist
          - entity: binary_sensor.hvac_data_quality_problem
          - entity: sensor.mains_data_quality_checklist
          - entity: binary_sensor.mains_data_quality_problem
  - type: grid
    title: Learning progress
    cards:
      - type: entities
        title: Appliance baselines
        entities:
          - entity: sensor.refrigerator_learning_progress
          - entity: binary_sensor.refrigerator_learning
          - entity: sensor.hvac_learning_progress
          - entity: binary_sensor.hvac_learning
          - entity: sensor.mains_learning_progress
          - entity: binary_sensor.mains_learning
      - type: entities
        title: Service windows
        entities:
          - entity: binary_sensor.refrigerator_maintenance
          - entity: sensor.refrigerator_sensitivity
          - entity: binary_sensor.hvac_maintenance
          - entity: sensor.hvac_sensitivity
          - entity: binary_sensor.mains_maintenance
          - entity: sensor.mains_sensitivity
  - type: grid
    title: Circuit summaries
    cards:
      - type: entities
        title: Refrigerator
        entities:
          - entity: sensor.refrigerator_anomaly_score
          - entity: sensor.refrigerator_last_event
          - entity: sensor.refrigerator_alert_evidence
      - type: entities
        title: HVAC
        entities:
          - entity: sensor.hvac_anomaly_score
          - entity: sensor.hvac_last_event
          - entity: sensor.hvac_alert_evidence
          - entity: sensor.hvac_current_demand
          - entity: sensor.hvac_peak_demand
          - entity: sensor.hvac_demand_limit_usage
          - entity: sensor.hvac_demand_status
      - type: entities
        title: Mains
        entities:
          - entity: sensor.mains_anomaly_score
          - entity: sensor.mains_last_event
          - entity: sensor.mains_alert_evidence
          - entity: sensor.mains_balance_power
          - entity: sensor.mains_monitored_power
          - entity: sensor.mains_monitored_coverage
          - entity: sensor.mains_balance_status
  - type: grid
    title: Active evidence
    cards:
      - type: history-graph
        title: Recent anomaly score
        hours_to_show: 24
        entities:
          - entity: sensor.refrigerator_anomaly_score
          - entity: sensor.hvac_anomaly_score
          - entity: sensor.mains_anomaly_score
      - type: entities
        title: Alert evidence
        entities:
          - entity: sensor.refrigerator_alert_evidence
          - entity: sensor.hvac_alert_evidence
          - entity: sensor.mains_alert_evidence
  - type: grid
    title: Power-quality diagnostics
    cards:
      - type: entities
        title: Refrigerator power quality
        entities:
          - entity: sensor.refrigerator_power_quality_score
          - entity: sensor.refrigerator_power_quality_evidence
          - entity: sensor.refrigerator_reactive_power_drift
          - entity: sensor.refrigerator_apparent_power_drift
          - entity: sensor.refrigerator_power_factor_drift
      - type: entities
        title: HVAC power quality
        entities:
          - entity: sensor.hvac_power_quality_score
          - entity: sensor.hvac_power_quality_evidence
          - entity: sensor.hvac_reactive_power_drift
          - entity: sensor.hvac_apparent_power_drift
          - entity: sensor.hvac_power_factor_drift
  - type: grid
    title: Energy usage and demand
    cards:
      - type: entities
        title: Refrigerator energy usage
        entities:
          - entity: sensor.refrigerator_daily_energy_usage
          - entity: sensor.refrigerator_energy_usage_share
          - entity: sensor.refrigerator_energy_usage_status
      - type: entities
        title: Refrigerator billing cycle
        entities:
          - entity: sensor.refrigerator_billing_cycle_usage
          - entity: sensor.refrigerator_billing_cycle_forecast
          - entity: sensor.refrigerator_billing_cycle_budget_usage
          - entity: sensor.refrigerator_billing_cycle_status
      - type: entities
        title: Refrigerator cost
        entities:
          - entity: sensor.refrigerator_cost_current_rate
          - entity: sensor.refrigerator_cost_cycle
          - entity: sensor.refrigerator_cost_cycle_forecast
          - entity: sensor.refrigerator_cost_status
      - type: entities
        title: Refrigerator standby
        entities:
          - entity: sensor.refrigerator_always_on_power
          - entity: sensor.refrigerator_standby_threshold
          - entity: sensor.refrigerator_standby_status
          - entity: sensor.refrigerator_always_on_limit_usage
      - type: entities
        title: HVAC demand
        entities:
          - entity: sensor.hvac_current_demand
          - entity: sensor.hvac_peak_demand
          - entity: sensor.hvac_demand_limit_usage
          - entity: sensor.hvac_demand_status
      - type: entities
        title: Mains balance
        entities:
          - entity: sensor.mains_balance_power
          - entity: sensor.mains_monitored_power
          - entity: sensor.mains_monitored_coverage
          - entity: sensor.mains_balance_status
  - type: grid
    title: Experimental NILM review
    cards:
      - type: entities
        title: Mains NILM
        entities:
          - entity: sensor.mains_nilm_discovered_signatures
          - entity: sensor.mains_nilm_unmatched_load_percentage
          - entity: sensor.mains_learning_progress
          - entity: sensor.mains_alert_evidence
      - type: entities
        title: Review controls
        entities:
          - entity: sensor.mains_readiness
          - entity: sensor.mains_sensitivity
          - entity: binary_sensor.mains_maintenance
