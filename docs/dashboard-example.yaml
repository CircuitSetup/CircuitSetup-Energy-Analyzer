title: Energy Analyzer
views:
  - type: sections
    title: Overview
    path: overview
    sections:
      - type: grid
        title: Appliance Status
        cards:
          - type: markdown
            title: Appliance Status
            content: >
              These cards keep each appliance to Activity, Electrical Health,
              Energy Summary, and Daily Energy Usage. Daily Energy Usage may show
              Waiting For Energy Change until a cumulative kWh source increases.
          - type: entities
            title: Refrigerator
            entities:
              - entity: sensor.refrigerator_activity_summary
                name: Activity
              - entity: sensor.refrigerator_electrical_health
                name: Electrical Health
              - entity: sensor.refrigerator_energy_summary
                name: Energy Summary
              - entity: sensor.refrigerator_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: HVAC
            entities:
              - entity: sensor.hvac_activity_summary
                name: Activity
              - entity: sensor.hvac_electrical_health
                name: Electrical Health
              - entity: sensor.hvac_energy_summary
                name: Energy Summary
              - entity: sensor.hvac_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: Water heater
            entities:
              - entity: sensor.water_heater_activity_summary
                name: Activity
              - entity: sensor.water_heater_electrical_health
                name: Electrical Health
              - entity: sensor.water_heater_energy_summary
                name: Energy Summary
              - entity: sensor.water_heater_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: Pool pump
            entities:
              - entity: sensor.pool_pump_activity_summary
                name: Activity
              - entity: sensor.pool_pump_electrical_health
                name: Electrical Health
              - entity: sensor.pool_pump_energy_summary
                name: Energy Summary
              - entity: sensor.pool_pump_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: Washer
            entities:
              - entity: sensor.washer_activity_summary
                name: Activity
              - entity: sensor.washer_electrical_health
                name: Electrical Health
              - entity: sensor.washer_energy_summary
                name: Energy Summary
              - entity: sensor.washer_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: Dryer
            entities:
              - entity: sensor.dryer_activity_summary
                name: Activity
              - entity: sensor.dryer_electrical_health
                name: Electrical Health
              - entity: sensor.dryer_energy_summary
                name: Energy Summary
              - entity: sensor.dryer_daily_energy_usage
                name: Daily Energy Usage
          - type: entities
            title: Car charger
            entities:
              - entity: sensor.car_charger_activity_summary
                name: Activity
              - entity: sensor.car_charger_electrical_health
                name: Electrical Health
              - entity: sensor.car_charger_energy_summary
                name: Energy Summary
              - entity: sensor.car_charger_daily_energy_usage
                name: Daily Energy Usage

      - type: grid
        title: Mains, Solar, and NILM
        cards:
          - type: glance
            title: Mains rollups
            columns: 3
            entities:
              - entity: sensor.mains_nilm_activity_summary
                name: Activity
              - entity: sensor.mains_nilm_electrical_health
                name: Electrical
              - entity: sensor.mains_nilm_energy_summary
                name: Energy
          - type: gauge
            entity: sensor.mains_nilm_monitored_coverage
            name: Known Load Share
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 40
              green: 70
          - type: entities
            title: Mains Load Match
            entities:
              - entity: sensor.mains_nilm_monitored_power
                name: Known Appliance Load
              - entity: sensor.mains_nilm_balance_power
                name: Unassigned Mains Load
              - entity: sensor.mains_nilm_monitored_coverage
                name: Known Load Share
          - type: markdown
            title: What Known Load Share Means
            content: >
              Known Load Share is how much of current mains power is explained
              by the circuits you selected. Low values usually mean normal
              unmonitored loads, not necessarily a problem.
          - type: tile
            entity: sensor.mains_nilm_nilm_unknown_loads
            name: Unknown Load Inventory
            vertical: false
          - type: glance
            title: Unknown load signals
            columns: 3
            entities:
              - entity: sensor.mains_nilm_nilm_unknown_loads
                name: Inventory
              - entity: sensor.mains_nilm_nilm_discovered_signatures
                name: Signatures
              - entity: sensor.mains_nilm_monitored_coverage
                name: Known Load Share
          - type: conditional
            conditions:
              - entity: sensor.mains_nilm_solar_flow_status
                state_not: unavailable
              - entity: sensor.mains_nilm_solar_flow_status
                state_not: unknown
            card:
              type: entities
              title: Solar flow
              entities:
                - entity: sensor.mains_nilm_solar_flow_status
                  name: Solar Flow
                - entity: sensor.mains_nilm_solar_surplus_power
                  name: Solar Surplus
          - type: conditional
            conditions:
              - entity: sensor.mains_nilm_utility_comparison_status
                state_not: unavailable
              - entity: sensor.mains_nilm_utility_comparison_status
                state_not: unknown
            card:
              type: entities
              title: Utility comparison
              entities:
                - entity: sensor.mains_nilm_utility_comparison_difference
                  name: Utility Difference
                - entity: sensor.mains_nilm_utility_comparison_status
                  name: Utility Status
          - type: statistics-graph
            title: Mains daily energy
            days_to_show: 7
            period: day
            stat_types:
              - max
            entities:
              - entity: sensor.mains_nilm_daily_energy_usage

      - type: grid
        title: Energy Tracking
        cards:
          - type: statistics-graph
            title: Daily energy trend
            days_to_show: 7
            period: day
            stat_types:
              - max
            entities:
              - entity: sensor.refrigerator_daily_energy_usage
              - entity: sensor.hvac_daily_energy_usage
              - entity: sensor.water_heater_daily_energy_usage
              - entity: sensor.pool_pump_daily_energy_usage
              - entity: sensor.washer_daily_energy_usage
              - entity: sensor.dryer_daily_energy_usage
              - entity: sensor.car_charger_daily_energy_usage
          - type: history-graph
            title: Appliance activity
            hours_to_show: 48
            entities:
              - entity: sensor.refrigerator_activity_summary
              - entity: sensor.hvac_activity_summary
              - entity: sensor.water_heater_activity_summary
              - entity: sensor.pool_pump_activity_summary
              - entity: sensor.washer_activity_summary
              - entity: sensor.dryer_activity_summary
              - entity: sensor.car_charger_activity_summary
          - type: glance
            title: Electrical health rollups
            columns: 4
            entities:
              - entity: sensor.refrigerator_electrical_health
                name: Refrigerator
              - entity: sensor.hvac_electrical_health
                name: HVAC
              - entity: sensor.water_heater_electrical_health
                name: Water heater
              - entity: sensor.pool_pump_electrical_health
                name: Pool pump
              - entity: sensor.washer_electrical_health
                name: Washer
              - entity: sensor.dryer_electrical_health
                name: Dryer
              - entity: sensor.car_charger_electrical_health
                name: Car charger
              - entity: sensor.mains_nilm_electrical_health
                name: Mains
          - type: conditional
            conditions:
              - entity: sensor.water_heater_water_flow_correlation
                state_not: unavailable
              - entity: sensor.water_heater_water_flow_correlation
                state_not: unknown
              - entity: sensor.washer_water_flow_correlation
                state_not: unavailable
              - entity: sensor.washer_water_flow_correlation
                state_not: unknown
            card:
              type: glance
              title: Water flow context
              columns: 2
              entities:
                - entity: sensor.water_heater_water_flow_correlation
                  name: Water heater
                - entity: sensor.washer_water_flow_correlation
                  name: Washer
          - type: horizontal-stack
            title: Settings and exports
            cards:
              - type: button
                name: Recalculate suggested settings
                icon: mdi:tune-variant
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.circuitsetup_energy_analyzer_recalculate_suggestions
              - type: button
                name: Export refrigerator history CSV
                icon: mdi:file-delimited-outline
                tap_action:
                  action: call-service
                  service: circuitsetup_energy_analyzer.export_history_csv
                  data:
                    circuit_id: refrigerator

      - type: grid
        title: HVAC Weather Context
        cards:
          - type: conditional
            conditions:
              - entity: sensor.hvac_outdoor_temperature
                state_not: unavailable
              - entity: sensor.hvac_outdoor_temperature
                state_not: unknown
            card:
              type: statistics-graph
              title: HVAC daily energy and outdoor temperature
              days_to_show: 7
              period: day
              stat_types:
                - max
              entities:
                - entity: sensor.hvac_daily_energy_usage
                  name: Daily Energy Usage
                - entity: sensor.hvac_outdoor_temperature
                  name: Outdoor Temperature
          - type: conditional
            conditions:
              - entity: sensor.hvac_weather_context
                state_not: unavailable
              - entity: sensor.hvac_weather_context
                state_not: unknown
            card:
              type: tile
              entity: sensor.hvac_weather_context
              name: Outdoor Weather Context
              vertical: false
          - type: markdown
            title: Alert Philosophy
            content: >
                Notifications and repairs: appliance alerts use persistent
                notifications with observed evidence. Repairs are reserved for
                setup, configuration, missing sensors, stale data, or other
                data-quality problems. Demand and capacity findings are
                operational evidence from energy measurements, not electrical
                safety verification, code compliance, or breaker sizing advice.
