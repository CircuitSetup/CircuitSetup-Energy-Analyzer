title: Energy Analyzer
views:
  - type: sections
    title: Home
    path: overview
    icon: mdi:home-lightning-bolt
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-house-flow
            grid_options:
              columns: 24
            title: Home energy summary
            setup_health_entity: sensor.circuitsetup_energy_analyzer_setup_health
            setup_health_path: /circuitsetup-energy-analyzer-evidence?setup_health=1
            primary_mains:
              circuit_id: mains
              name: Mains
              power_entities:
                - sensor.mains_power
              daily_energy_usage_entity: sensor.mains_daily_energy_usage
              cost_today_entity: sensor.mains_cost_today
              average_kwh_per_day_entity: sensor.mains_average_kwh_per_day
              average_cost_per_day_entity: sensor.mains_average_cost_per_day
              monitored_power_entity: sensor.mains_monitored_power
              balance_power_entity: sensor.mains_balance_power
              monitored_coverage_entity: sensor.mains_monitored_coverage
              nilm_unknown_loads_entity: sensor.mains_nilm_unknown_loads
              solar_flow_status_entity: sensor.mains_solar_flow_status
              solar_surplus_power_entity: sensor.mains_solar_surplus_power
              utility_comparison_status_entity: sensor.mains_utility_comparison_status
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                icon: mdi:fridge-outline
                area: Kitchen
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=refrigerator
                power_entities:
                  - sensor.refrigerator_power
                activity_entity: sensor.refrigerator_activity_summary
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                health_entity: sensor.refrigerator_health_summary
              - circuit_id: hvac
                name: HVAC
                icon: mdi:hvac
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=hvac
                power_entities:
                  - sensor.hvac_power
                activity_entity: sensor.hvac_activity_summary
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                health_entity: sensor.hvac_health_summary
              - circuit_id: washer
                name: Washer
                icon: mdi:washing-machine
                area: Laundry
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=washer
                power_entities:
                  - sensor.washer_power
                activity_entity: sensor.washer_activity_summary
                energy_today_entity: sensor.washer_daily_energy_usage
                cost_today_entity: sensor.washer_cost_today
                health_entity: sensor.washer_health_summary

          - type: custom:circuitsetup-energy-analyzer-appliance-grid
            grid_options:
              columns: 24
            title: Appliances
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                icon: mdi:fridge-outline
                area: Kitchen
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=refrigerator
                power_entities:
                  - sensor.refrigerator_power
                activity_entity: sensor.refrigerator_activity_summary
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                health_entity: sensor.refrigerator_health_summary
              - circuit_id: hvac
                name: HVAC
                icon: mdi:hvac
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=hvac
                power_entities:
                  - sensor.hvac_power
                activity_entity: sensor.hvac_activity_summary
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                health_entity: sensor.hvac_health_summary
              - circuit_id: washer
                name: Washer
                icon: mdi:washing-machine
                area: Laundry
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=washer
                power_entities:
                  - sensor.washer_power
                activity_entity: sensor.washer_activity_summary
                energy_today_entity: sensor.washer_daily_energy_usage
                cost_today_entity: sensor.washer_cost_today
                health_entity: sensor.washer_health_summary

          - type: custom:circuitsetup-energy-analyzer-energy-cost
            grid_options:
              columns: 24
            title: Energy and costs
            api_path: circuitsetup_energy_analyzer/appliance_insights
            primary_mains:
              circuit_id: mains
              name: Mains
              power_entities:
                - sensor.mains_power
              daily_energy_usage_entity: sensor.mains_daily_energy_usage
              cost_today_entity: sensor.mains_cost_today
            appliances:
              - circuit_id: refrigerator
                name: Refrigerator
                icon: mdi:fridge-outline
                area: Kitchen
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=refrigerator
                power_entities:
                  - sensor.refrigerator_power
                activity_entity: sensor.refrigerator_activity_summary
                energy_today_entity: sensor.refrigerator_daily_energy_usage
                cost_today_entity: sensor.refrigerator_cost_today
                health_entity: sensor.refrigerator_health_summary
              - circuit_id: hvac
                name: HVAC
                icon: mdi:hvac
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=hvac
                power_entities:
                  - sensor.hvac_power
                activity_entity: sensor.hvac_activity_summary
                energy_today_entity: sensor.hvac_daily_energy_usage
                cost_today_entity: sensor.hvac_cost_today
                health_entity: sensor.hvac_health_summary
              - circuit_id: washer
                name: Washer
                icon: mdi:washing-machine
                area: Laundry
                detail_path: /circuitsetup-energy-analyzer-evidence?appliance_detail=1&circuit_id=washer
                power_entities:
                  - sensor.washer_power
                activity_entity: sensor.washer_activity_summary
                energy_today_entity: sensor.washer_daily_energy_usage
                cost_today_entity: sensor.washer_cost_today
                health_entity: sensor.washer_health_summary

  - type: sections
    title: Energy & Costs
    path: energy-costs
    icon: mdi:chart-bar
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-context-graph
            grid_options:
              columns: 24
            title: HVAC activity and outdoor temperature
            default_hours: 24
            periods:
              - 24
              - 168
              - 720
            entities:
              - entity: sensor.hvac_power
                name: HVAC power
                axis: left
              - entity: sensor.outdoor_temperature
                name: Outdoor temperature
                axis: right
          - type: custom:circuitsetup-energy-analyzer-context-graph
            grid_options:
              columns: 24
            title: Water flow context
            default_hours: 24
            periods:
              - 24
              - 168
              - 720
            water_contexts:
              - name: Washer
                correlation_entity: sensor.washer_water_flow_correlation
                power_entities:
                  - sensor.washer_power
  - type: sections
    title: Insights
    path: insights
    icon: mdi:lightbulb-on-outline
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:circuitsetup-energy-analyzer-house-flow
            grid_options:
              columns: 16
            mode: mains
            title: Mains and NILM
            primary_mains:
              circuit_id: mains
              name: Mains
              power_entities:
                - sensor.mains_power
              monitored_power_entity: sensor.mains_monitored_power
              balance_power_entity: sensor.mains_balance_power
              monitored_coverage_entity: sensor.mains_monitored_coverage
              nilm_unknown_loads_entity: sensor.mains_nilm_unknown_loads
              nilm_signature_count_entity: sensor.mains_nilm_signature_count
              solar_surplus_power_entity: sensor.mains_solar_surplus_power
          - type: button
            grid_options:
              columns: 16
            name: Review NILM Assignments
            icon: mdi:playlist-check
            tap_action:
              action: navigate
              navigation_path: /circuitsetup-energy-analyzer-evidence?nilm_workspace=1&circuit_id=mains
          - type: custom:circuitsetup-energy-analyzer-summary
            grid_options:
              columns: 16
            title: Billing Cycle
            entities:
              - entity: sensor.mains_billing_cycle_usage
                name: Usage
              - entity: sensor.mains_cost_cycle
                name: Cost so far
              - entity: sensor.mains_cost_cycle_forecast
                name: Projected cost
