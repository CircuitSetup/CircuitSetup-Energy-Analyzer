name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install fallback test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio ruff voluptuous

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

  home-assistant-contract:
    name: Home Assistant control entity contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Home Assistant test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run control entity contract tests
        run: pytest tests/test_control_entities.py -q
