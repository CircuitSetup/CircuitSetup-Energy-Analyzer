name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install fallback test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio ruff jinja2 PyYAML voluptuous voluptuous-serialize

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

  home-assistant-contract:
    name: Home Assistant contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Home Assistant test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Home Assistant contract tests
        run: python -m pytest tests/test_control_entities.py tests/test_config_flow.py tests_homeassistant -q
