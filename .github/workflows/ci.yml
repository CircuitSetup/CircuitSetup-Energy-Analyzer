name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser E2E and accessibility tests
        run: npm run test:e2e

      - name: Run disposable Home Assistant browser smoke test
        run: python -m pytest tests_homeassistant/test_browser_e2e.py -q

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  home-assistant-contract:
    name: Home Assistant contract tests (${{ matrix.ha-channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-channel: stable
            experimental: false
            python-version: "3.12"
          - ha-channel: dev
            experimental: true
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Home Assistant test dependencies (stable)
        if: matrix.ha-channel == 'stable'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install Home Assistant test dependencies (dev)
        if: matrix.ha-channel == 'dev'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --upgrade --no-cache-dir pytest pytest-asyncio pytest-homeassistant-custom-component
          python -m pip install --upgrade --no-cache-dir git+https://github.com/home-assistant/core.git@dev
          python -m pip install --upgrade --no-cache-dir home-assistant-frontend==20250109.2

      - name: Show Home Assistant version
        run: |
          python -c "from homeassistant.const import __version__; print(f'Home Assistant version: {__version__}')"

      - name: Run Home Assistant contract tests
        run: python -m pytest tests/test_control_entities.py tests/test_config_flow.py tests_homeassistant --ignore=tests_homeassistant/test_browser_e2e.py -q

  home-assistant-control-entity-contract:
    name: Home Assistant control entity contract
    runs-on: ubuntu-latest
    needs: home-assistant-contract
    if: ${{ always() }}
    steps:
      - name: Require Home Assistant contract matrix
        run: |
          if [ "${{ needs.home-assistant-contract.result }}" != "success" ]; then
            echo "Home Assistant contract matrix result: ${{ needs.home-assistant-contract.result }}"
            exit 1
          fi
          echo "Home Assistant contract matrix completed successfully."
