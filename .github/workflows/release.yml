name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.7.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version files match tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {tag}")
          version = tag[1:]

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package_version = pyproject["project"]["version"]
          manifest = json.loads(
              pathlib.Path(
                  "custom_components/circuitsetup_energy_analyzer/manifest.json"
              ).read_text()
          )
          manifest_version = manifest["version"]

          if package_version != version:
              raise SystemExit(
                  f"pyproject.toml version {package_version} does not match {tag}"
              )
          if manifest_version != version:
              raise SystemExit(
                  f"manifest.json version {manifest_version} does not match {tag}"
              )
          print(f"Version files match {tag}")
          PY

      - name: Verify release PR batch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          MINIMUM_RELEASE_PRS: "2"
        run: |
          python scripts/verify_release_batch.py \
            --tag "$RELEASE_TAG" \
            --minimum-prs "$MINIMUM_RELEASE_PRS"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Clean generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes_file="$(mktemp)"
          cleaned_notes_file="$(mktemp)"
          trap 'rm -f "$notes_file" "$cleaned_notes_file"' EXIT
          gh release view "$RELEASE_TAG" --json body --jq .body > "$notes_file"
          python scripts/clean_release_notes.py < "$notes_file" > "$cleaned_notes_file"
          gh release edit "$RELEASE_TAG" --notes-file "$cleaned_notes_file"
