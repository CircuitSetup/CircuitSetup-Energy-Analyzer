[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitsetup-energy-analyzer"
version = "0.13.7"
description = "Home Assistant custom integration for CircuitSetup Energy Meter appliance diagnostics"
requires-python = ">=3.12"
dependencies = [
  "homeassistant>=2025.1.0",
  "voluptuous>=0.15.2",
]

[project.optional-dependencies]
test = [
  "home-assistant-frontend==20250109.2",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-homeassistant-custom-component==0.13.205",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
"docs/codegraph/generate_codegraph.py" = ["E501", "T201", "UP017", "UP035"]
