blueprint:
  name: CircuitSetup Energy Analyzer Alerts
  description: >-
    Create friendly notifications and optional follow-up actions when selected
    CircuitSetup Energy Analyzer entities report a selected alert state backed by
    current alert evidence. Companion App mobile notifications can use data.url and
    data.clickAction with the evidence_path template variable.
  domain: automation
  input:
    alert_entities:
      name: Alert Entities
      description: Select analyzer status or alert entities that should trigger this automation.
      selector:
        entity:
          multiple: true
          filter:
            - integration: circuitsetup_energy_analyzer
    alert_states:
      name: Alert States
      description: >-
        Choose the states that should be treated as actionable alerts. Current
        summary entities use display states such as Possible issue and High
        Usage; older diagnostic status entities may use raw values such as
        projected_over_budget or over_limit.
      default:
        - possible_issue
        - possible_imbalance
        - possible_metric_mismatch
        - possible_power_quality_change
        - high_usage
        - watch
        - warning
        - mismatch
        - projected_over_budget
        - over_limit
        - issue
      selector:
        select:
          multiple: true
          mode: dropdown
          options:
            - label: Possible Issue
              value: possible_issue
            - label: Possible Imbalance
              value: possible_imbalance
            - label: Possible Metric Mismatch
              value: possible_metric_mismatch
            - label: Possible Power Quality Change
              value: possible_power_quality_change
            - label: High Usage
              value: high_usage
            - label: Watch
              value: watch
            - label: Needs Data
              value: needs_data
            - label: Needs Energy Data
              value: needs_energy_data
            - label: Needs Metrics
              value: needs_metrics
            - label: Mixed Observation
              value: mixed_observation
            - label: NILM Review
              value: nilm_review
            - label: Warning
              value: warning
            - label: Mismatch
              value: mismatch
            - label: Projected Over Budget
              value: projected_over_budget
            - label: Over Limit
              value: over_limit
            - label: Issue
              value: issue
            - label: Maintenance
              value: maintenance
            - label: Stale
              value: stale
    for_duration:
      name: Repeat Duration
      description: Require the alert state to remain active for this long before notifying.
      default:
        minutes: 5
      selector:
        duration:
    notification_title:
      name: Notification Title
      description: Title used for the persistent notification.
      default: CircuitSetup Energy Analyzer alert
      selector:
        text:
    persistent_notification:
      name: Persistent Notification
      description: Create a Home Assistant persistent notification with the observed evidence.
      default: true
      selector:
        boolean:
    alert_actions:
      name: Follow-up Actions
      description: >-
        Optional actions such as mobile notifications, lights, or scripts.
        Mobile app actions can use {{ evidence_path }} as both data.url and
        data.clickAction, for example url: "{{ evidence_path }}" and
        clickAction: "{{ evidence_path }}".
      default: []
      selector:
        action:

mode: queued
max: 10

trigger:
  - platform: state
    id: alert
    entity_id: !input alert_entities
    for: !input for_duration
  - platform: state
    id: state_changed
    entity_id: !input alert_entities

variables:
  alert_states: !input alert_states
  create_persistent_notification: !input persistent_notification
  notification_title: !input notification_title
  alert_entity_id: "{{ trigger.entity_id }}"
  persistent_notification_id: >-
    circuitsetup_energy_analyzer_blueprint_{{ alert_entity_id | replace('.', '_') }}
  alert_entity_name: "{{ trigger.to_state.name if trigger.to_state else trigger.entity_id }}"
  alert_state: >-
    {% set state = trigger.to_state.state if trigger.to_state else 'unknown' %}
    {% set electrical = trigger.to_state.attributes.get('electrical_summary')
       if trigger.to_state else none %}
    {{ electrical if electrical and electrical not in ['Normal', 'Needs Metrics']
       else state }}
  alert_state_normalized: >-
    {% set base_state = (alert_state | string).split(':', 1)[0] %}
    {{ base_state | lower | trim | replace(' ', '_') | replace('-', '_') }}
  alert_evidence: >-
    {% if trigger.to_state %}
      {% set attrs = trigger.to_state.attributes %}
      {% set electrical = attrs.get('electrical_summary') %}
      {% if electrical and electrical not in ['Normal', 'Needs Metrics'] %}
        {{ attrs.get('electrical_status_explanation')
           or attrs.get('power_quality_evidence')
           or attrs.get('status_explanation')
           or trigger.to_state.state }}
      {% else %}
        {{ attrs.get('evidence')
           or attrs.get('message')
           or attrs.get('status_explanation')
           or attrs.get('summary_explanation')
           or attrs.get('power_quality_evidence')
           or attrs.get('friendly_name')
           or trigger.to_state.state }}
      {% endif %}
    {% else %}
      Alert entity changed.
    {% endif %}
  evidence_path: >-
    {{- trigger.to_state.attributes.get('evidence_path')
        if trigger.to_state and trigger.to_state.attributes.get('evidence_path')
        else '/circuitsetup-energy-analyzer-evidence' -}}
  alert_is_actionable: >-
    {% set selected_states = alert_states
       | map('string')
       | map('lower')
       | map('trim')
       | map('replace', ' ', '_')
       | map('replace', '-', '_')
       | list %}
    {{ trigger.to_state is not none
       and alert_state_normalized in selected_states
       and not trigger.to_state.attributes.get('learning', true)
       and trigger.to_state.attributes.get('alert_confirmed', false)
       and (
         alert_state_normalized != 'possible_power_quality_change'
         or trigger.to_state.attributes.power_quality_alert_confirmed
            | default(false)
       ) }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'state_changed' and not (alert_is_actionable | bool) }}
        sequence:
          - service: persistent_notification.dismiss
            data:
              notification_id: "{{ persistent_notification_id }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'alert' and (alert_is_actionable | bool) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ create_persistent_notification }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      notification_id: "{{ persistent_notification_id }}"
                      title: "{{ notification_title }}"
                      message: >-
                        {{ alert_entity_name }} reports: {{ alert_state }}.

                        State: {{ alert_state }}

                        Evidence: {{ alert_evidence }}

                        [Open evidence graph]({{ evidence_path }})

                        Entity: {{ alert_entity_id }}
          - choose: []
            default: !input alert_actions
