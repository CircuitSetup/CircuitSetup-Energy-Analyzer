    name: Dishwasher
    appliance_profile: resistive_load
    circuit_mode: single_phase
    power_flow: load
    energy_usage_window_days: 7
    daily_energy_spike_ratio: 0.45
    sources:
      power: sensor.dishwasher_power
      energy: sensor.dishwasher_energy
      current: sensor.dishwasher_current
      voltage: sensor.dishwasher_voltage
