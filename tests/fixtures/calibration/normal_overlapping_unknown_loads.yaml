schema_version: 1
id: normal_overlapping_unknown_loads
description: Two recurring unknown mains loads overlap and should replay into NILM sessions.
scenario_type: normal
appliance_profile: mains_nilm
circuit_mode: mains_nilm
power_flow: mains_net
start_time: "2026-01-01T00:00:00+00:00"
sample_interval_seconds: 60
retention_mode: diagnostic

circuits:
  - circuit_id: mains
    name: Mains NILM
    appliance_profile: mains_nilm
    circuit_mode: mains_nilm
    power_flow: mains_net
    energy_usage_window_days: 7
    daily_energy_spike_ratio: 0.45
    sources:
      power: sensor.mains_power
      energy: sensor.mains_energy
      current: sensor.mains_current
      voltage: sensor.mains_voltage

