schema_version: 1
id: normal_solar_overlap_cycle
description: Normal load cycle overlapping solar generation stays quiet.
scenario_type: normal
appliance_profile: mixed
circuit_mode: mixed
power_flow: mains_net
start_time: "2026-01-01T00:00:00+00:00"
sample_interval_seconds: 60
retention_mode: standard

circuits:
  - circuit_id: kettle
    name: Kettle
    appliance_profile: resistive_load
    circuit_mode: single_phase
    power_flow: load
    energy_usage_window_days: 7
    daily_energy_spike_ratio: 0.45
    sources:
      power: sensor.kettle_power
      energy: sensor.kettle_energy
      current: sensor.kettle_current
      voltage: sensor.kettle_voltage
  - circuit_id: rooftop_solar
    name: Rooftop Solar
    appliance_profile: solar_inverter
    circuit_mode: single_phase
    power_flow: generation
    energy_usage_window_days: 7
    daily_energy_spike_ratio: 0.45
    sources:
      power: sensor.rooftop_solar_power
      energy: sensor.rooftop_solar_energy
      current: sensor.rooftop_solar_current
      voltage: sensor.rooftop_solar_voltage

samples:
  - t: 0
    states:
      sensor.kettle_power: 0
      sensor.kettle_energy: 30.0
      sensor.kettle_current: 0.0
      sensor.kettle_voltage: 120.0
      sensor.rooftop_solar_power: 0
      sensor.rooftop_solar_energy: 500.0
      sensor.rooftop_solar_current: 0.0
      sensor.rooftop_solar_voltage: 240.0
  - t: 60
    states:
      sensor.kettle_power: 1500
      sensor.kettle_energy: 30.0
      sensor.kettle_current: 12.5
      sensor.kettle_voltage: 119.8
      sensor.rooftop_solar_power: -2500
      sensor.rooftop_solar_energy: 500.0
      sensor.rooftop_solar_current: 10.4
      sensor.rooftop_solar_voltage: 240.1
  - t: 120
    states:
      sensor.kettle_power: 1480
      sensor.kettle_energy: 30.03
      sensor.kettle_current: 12.3
      sensor.kettle_voltage: 120.0
      sensor.rooftop_solar_power: -2600
      sensor.rooftop_solar_energy: 500.04
      sensor.rooftop_solar_current: 10.8
      sensor.rooftop_solar_voltage: 240.0
  - t: 180
    states:
      sensor.kettle_power: 1460
      sensor.kettle_energy: 30.05
      sensor.kettle_current: 12.2
      sensor.kettle_voltage: 120.1
      sensor.rooftop_solar_power: -2400
      sensor.rooftop_solar_energy: 500.08
      sensor.rooftop_solar_current: 10.0
      sensor.rooftop_solar_voltage: 239.9
  - t: 240
    states:
      sensor.kettle_power: 0
      sensor.kettle_energy: 30.07
      sensor.kettle_current: 0.0
      sensor.kettle_voltage: 120.0
      sensor.rooftop_solar_power: -2300
      sensor.rooftop_solar_energy: 500.12
      sensor.rooftop_solar_current: 9.6
      sensor.rooftop_solar_voltage: 240.0
  - t: 300
    states:
      sensor.kettle_power: 0
      sensor.kettle_energy: 30.07
      sensor.kettle_current: 0.0
      sensor.kettle_voltage: 120.1
      sensor.rooftop_solar_power: 0
      sensor.rooftop_solar_energy: 500.13
      sensor.rooftop_solar_current: 0.0
      sensor.rooftop_solar_voltage: 240.1
  - t: 360
    states:
      sensor.kettle_power: 0
      sensor.kettle_energy: 30.07
      sensor.kettle_current: 0.0
      sensor.kettle_voltage: 120.0
      sensor.rooftop_solar_power: 0
      sensor.rooftop_solar_energy: 500.13
      sensor.rooftop_solar_current: 0.0
      sensor.rooftop_solar_voltage: 240.0

segments:
  - pattern: daily_energy_deltas
    circuit_id: kettle
    start_t: 86400
    interval_seconds: 86400
    energy_start_kwh: 30.07
    power_w: 0
    current_a: 0.0
    voltage_v: 120.0
    daily_usage_kwh: [0.55, 0.52, 0.54, 0.56, 0.53, 0.55, 0.52, 0.54, 0.56, 0.53]
  - pattern: daily_energy_deltas
    circuit_id: rooftop_solar
    start_t: 86400
    interval_seconds: 86400
    energy_start_kwh: 500.13
    power_w: 0
    current_a: 0.0
    voltage_v: 240.0
    daily_usage_kwh: [18.5, 18.2, 18.4, 18.6, 18.3, 18.5, 18.2, 18.4, 18.6, 18.3]

labels:
  expected_events:
    - circuit_id: kettle
      event_type: start
      around_t: 60
      tolerance_seconds: 60
    - circuit_id: kettle
      event_type: stop
      around_t: 240
      tolerance_seconds: 60
    - circuit_id: rooftop_solar
      event_type: start
      around_t: 60
      tolerance_seconds: 60
    - circuit_id: rooftop_solar
      event_type: stop
      around_t: 300
      tolerance_seconds: 60
  expected_alerts: []
  expected_no_alerts:
    - circuit_id: kettle
      feature: "*"
      start_t: 0
      end_t: 950400
    - circuit_id: rooftop_solar
      feature: "*"
      start_t: 0
      end_t: 950400

calibration_expectations:
  max_false_positive_alerts: 0
  min_true_positive_alerts: 0
  max_false_negative_alerts: 0
  expected_precision_at_least: null
  expected_recall_at_least: null
