relearn_baseline:
  name: Relearn baseline
  description: Relearn the baseline for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
pause_alerts:
  name: Pause alerts
  description: Pause alert notifications for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    duration:
      name: Duration
      description: How long alert notifications should stay paused.
      required: false
      example: "01:00:00"
      selector:
        text:
acknowledge_alert:
  name: Acknowledge alert
  description: Acknowledge an alert evidence notification.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_cycle_duration_s
      selector:
        text:
export_diagnostics:
  name: Export diagnostics
  description: Export diagnostics for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
export_history_csv:
  name: Export history CSV
  description: Export retained analyzer history for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
run_mapping_checks:
  name: Run mapping checks
  description: Run configured source-entity mapping checks.
  fields: {}
label_nilm_signature:
  name: Label NILM signature
  description: Label a detected NILM signature for a mains circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to label.
      required: true
      example: signature_1
      selector:
        text:
    label:
      name: Label
      description: Friendly load name to assign to the signature.
      required: true
      example: Microwave
      selector:
        text:
ignore_nilm_signature:
  name: Ignore NILM signature
  description: Ignore a detected NILM signature for a mains circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to ignore.
      required: true
      example: signature_1
      selector:
        text:
set_circuit_sensitivity:
  name: Set circuit sensitivity
  description: Set the alert sensitivity preset for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    preset:
      name: Preset
      description: Alert sensitivity preset for the circuit.
      required: true
      example: balanced
      selector:
        select:
          options:
            - quiet
            - balanced
            - sensitive
set_energy_usage_settings:
  name: Set energy usage settings
  description: Set daily energy usage spike tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    window_days:
      name: Window Days
      description: Rolling energy baseline window in days for the circuit.
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 60
          mode: box
    daily_spike_ratio:
      name: Daily Spike Ratio
      description: Daily usage share that can trigger a possible-issue alert.
      required: false
      example: 0.25
      selector:
        number:
          min: 0.01
          max: 1
          step: 0.01
          mode: box
set_energy_goal_settings:
  name: Set energy goal settings
  description: Set daily kWh goal tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    daily_goal_kwh:
      name: Daily Goal kWh
      description: Daily kWh target for this circuit; use 0 to clear it.
      required: false
      example: 12
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
    goal_alert_ratio:
      name: Goal Alert Ratio
      description: Goal share that can trigger daily energy goal notices.
      required: false
      example: 1.0
      selector:
        number:
          min: 0.01
          max: 2
          step: 0.01
          mode: box
set_demand_settings:
  name: Set demand settings
  description: Set rolling demand tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: hvac
      selector:
        text:
    window_minutes:
      name: Window Minutes
      description: Rolling demand averaging window in minutes for the circuit.
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 120
          mode: box
    demand_limit_w:
      name: Demand Limit W
      description: Optional rolling demand limit in watts for notifications.
      required: false
      example: 4500
      selector:
        number:
          min: 1
          max: 100000
          mode: box
set_capacity_settings:
  name: Set capacity settings
  description: Set breaker amp capacity tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as ev or hvac.
      required: true
      example: ev
      selector:
        text:
    breaker_amps:
      name: Breaker Amps
      description: Breaker or circuit rating in amps used for capacity diagnostics.
      required: false
      example: 40
      selector:
        number:
          min: 1
          max: 400
          step: 0.1
          mode: box
    warning_ratio:
      name: Warning Ratio
      description: Share of breaker amps that can trigger repeated capacity alerts.
      required: false
      example: 0.8
      selector:
        number:
          min: 0.01
          max: 1
          step: 0.01
          mode: box
set_activity_alert_settings:
  name: Set activity alert settings
  description: Set user-configured activity alert limits for one circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    max_active_minutes:
      name: Max Active Minutes
      description: Notify when the circuit stays active longer than this many minutes.
      required: false
      example: 45
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    max_idle_minutes:
      name: Max Idle Minutes
      description: Notify when the circuit shows no activity longer than this many minutes.
      required: false
      example: 120
      selector:
        number:
          min: 1
          max: 10080
          mode: box
set_billing_cycle_settings:
  name: Set billing cycle settings
  description: Set billing-cycle usage forecasting for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    cycle_start_day:
      name: Cycle Start Day
      description: Day of the month when the utility billing cycle starts.
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 31
          mode: box
    budget_kwh:
      name: Budget kWh
      description: Optional kWh budget for the current billing cycle.
      required: false
      example: 300
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    budget_alert_ratio:
      name: Budget Alert Ratio
      description: Budget share that can trigger projected-over-budget alerts.
      required: false
      example: 1.0
      selector:
        number:
          min: 0.01
          max: 2
          step: 0.01
          mode: box
set_cost_settings:
  name: Set cost settings
  description: Set flat-rate and Time-of-Use cost tracking for one circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    cycle_start_day:
      name: Cycle Start Day
      description: Day of the month when the utility billing cycle starts.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 31
          mode: box
    default_rate_per_kwh:
      name: Default Rate Per kWh
      description: Default electricity cost rate applied outside TOU periods.
      required: false
      example: 0.20
      selector:
        number:
          min: 0.0001
          max: 1000
          step: 0.0001
          mode: box
    tou_rate_per_kwh:
      name: TOU Rate Per kWh
      description: Optional Time-of-Use cost rate for the configured period.
      required: false
      example: 0.30
      selector:
        number:
          min: 0.0001
          max: 1000
          step: 0.0001
          mode: box
    tou_start:
      name: TOU Start
      description: Time-of-Use period start time in 24-hour HH:MM format.
      required: false
      example: "17:00"
      selector:
        text:
    tou_end:
      name: TOU End
      description: Time-of-Use period end time in 24-hour HH:MM format.
      required: false
      example: "21:00"
      selector:
        text:
    tou_weekdays:
      name: TOU Weekdays
      description: Optional comma-separated weekdays where Monday is 0.
      required: false
      example: "0,1,2,3,4"
      selector:
        text:
    tou_name:
      name: TOU Name
      description: Friendly name for the Time-of-Use rate period.
      required: false
      example: Peak
      selector:
        text:
set_standby_settings:
  name: Set standby settings
  description: Set Always On and standby tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    window_hours:
      name: Window Hours
      description: Rolling Always On analysis window in hours for the circuit.
      required: false
      example: 24
      selector:
        number:
          min: 1
          max: 168
          mode: box
    standby_threshold_w:
      name: Standby Threshold W
      description: Power at or below this wattage is treated as standby.
      required: false
      example: 8
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    always_on_alert_w:
      name: Always On Alert W
      description: Optional Always On wattage limit for possible-issue alerts.
      required: false
      example: 25
      selector:
        number:
          min: 1
          max: 100000
          mode: box
set_utility_comparison_settings:
  name: Set utility comparison settings
  description: Compare utility-reported kWh with a mains kWh sensor or summed circuit kWh sensors.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured aggregate circuit identifier, usually mains.
      required: true
      example: mains
      selector:
        text:
    utility_energy_entity:
      name: Utility Energy Entity
      description: Opower or utility kWh sensor representing the same period as measured data.
      required: false
      example: sensor.opower_current_bill_usage
      selector:
        entity:
          domain: sensor
    measured_energy_entities:
      name: Measured Energy Entities
      description: Optional mains kWh sensors; leave empty to sum configured load circuit energy sensors.
      required: false
      example:
        - sensor.panel_import_energy
      selector:
        entity:
          domain: sensor
          multiple: true
    tolerance_percent:
      name: Tolerance Percent
      description: Percent difference allowed before repeated observations create a possible-issue alert.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
start_maintenance:
  name: Start maintenance
  description: Pause appliance alert notifications while a circuit is being serviced.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    note:
      name: Note
      description: Optional maintenance note stored with the circuit.
      required: false
      example: Cleaned coils
      selector:
        text:
    duration:
      name: Duration
      description: How long the circuit should stay in maintenance mode.
      required: false
      example: "02:00:00"
      selector:
        duration:
    relearn_on_end:
      name: Relearn On End
      description: Relearn the circuit baseline when maintenance ends.
      required: false
      example: false
      selector:
        boolean:
end_maintenance:
  name: End maintenance
  description: Resume appliance alert notifications for a serviced circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    relearn:
      name: Relearn
      description: Relearn the circuit baseline after ending maintenance.
      required: false
      example: false
      selector:
        boolean:
mark_alert_expected:
  name: Mark alert expected
  description: Mark an alert pattern as expected so repeated notifications are suppressed.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_reactive_power
      selector:
        text:
mark_alert_unhelpful:
  name: Mark alert unhelpful
  description: Mark an alert pattern as unhelpful so repeated notifications are suppressed.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_reactive_power
      selector:
        text:
mark_nilm_signature_expected:
  name: Mark NILM signature expected
  description: Mark an experimental NILM signature as an expected load pattern.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to mark expected.
      required: true
      example: signature_1
      selector:
        text:
merge_nilm_signatures:
  name: Merge NILM signatures
  description: Merge two experimental NILM signatures that represent the same load.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    source_signature_id:
      name: Source Signature ID
      description: Signature identifier to merge into the target signature.
      required: true
      example: signature_2
      selector:
        text:
    target_signature_id:
      name: Target Signature ID
      description: Signature identifier that should keep the merged history.
      required: true
      example: signature_1
      selector:
        text:
