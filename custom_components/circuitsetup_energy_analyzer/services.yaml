relearn_baseline:
  name: Relearn baseline
  description: Relearn the baseline for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
pause_alerts:
  name: Pause alerts
  description: Pause alert notifications for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    duration:
      name: Duration
      description: How long alert notifications should stay paused.
      required: false
      example: "01:00:00"
      selector:
        text:
acknowledge_alert:
  name: Acknowledge alert
  description: Acknowledge an alert evidence notification.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_cycle_duration_s
      selector:
        text:
export_diagnostics:
  name: Export diagnostics
  description: Export diagnostics for a configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
run_mapping_checks:
  name: Run mapping checks
  description: Run configured source-entity mapping checks.
  fields: {}
label_nilm_signature:
  name: Label NILM signature
  description: Label a detected NILM signature for a mains circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to label.
      required: true
      example: signature_1
      selector:
        text:
    label:
      name: Label
      description: Friendly load name to assign to the signature.
      required: true
      example: Microwave
      selector:
        text:
ignore_nilm_signature:
  name: Ignore NILM signature
  description: Ignore a detected NILM signature for a mains circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to ignore.
      required: true
      example: signature_1
      selector:
        text:
set_circuit_sensitivity:
  name: Set circuit sensitivity
  description: Set the alert sensitivity preset for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    preset:
      name: Preset
      description: Alert sensitivity preset for the circuit.
      required: true
      example: balanced
      selector:
        select:
          options:
            - quiet
            - balanced
            - sensitive
set_energy_usage_settings:
  name: Set energy usage settings
  description: Set daily energy usage spike tracking for one configured circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    window_days:
      name: Window Days
      description: Rolling energy baseline window in days for the circuit.
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 60
          mode: box
    daily_spike_ratio:
      name: Daily Spike Ratio
      description: Daily usage share that can trigger a possible-issue alert.
      required: false
      example: 0.25
      selector:
        number:
          min: 0.01
          max: 1
          step: 0.01
          mode: box
start_maintenance:
  name: Start maintenance
  description: Pause appliance alert notifications while a circuit is being serviced.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    note:
      name: Note
      description: Optional maintenance note stored with the circuit.
      required: false
      example: Cleaned coils
      selector:
        text:
    duration:
      name: Duration
      description: How long the circuit should stay in maintenance mode.
      required: false
      example: "02:00:00"
      selector:
        duration:
    relearn_on_end:
      name: Relearn On End
      description: Relearn the circuit baseline when maintenance ends.
      required: false
      example: false
      selector:
        boolean:
end_maintenance:
  name: End maintenance
  description: Resume appliance alert notifications for a serviced circuit.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: fridge
      selector:
        text:
    relearn:
      name: Relearn
      description: Relearn the circuit baseline after ending maintenance.
      required: false
      example: false
      selector:
        boolean:
mark_alert_expected:
  name: Mark alert expected
  description: Mark an alert pattern as expected so repeated notifications are suppressed.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_reactive_power
      selector:
        text:
mark_alert_unhelpful:
  name: Mark alert unhelpful
  description: Mark an alert pattern as unhelpful so repeated notifications are suppressed.
  fields:
    alert_id:
      name: Alert ID
      description: Alert identifier from the alert evidence notification.
      required: true
      example: circuitsetup_energy_analyzer_alert_fridge_reactive_power
      selector:
        text:
mark_nilm_signature_expected:
  name: Mark NILM signature expected
  description: Mark an experimental NILM signature as an expected load pattern.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    signature_id:
      name: Signature ID
      description: Detected NILM signature identifier to mark expected.
      required: true
      example: signature_1
      selector:
        text:
merge_nilm_signatures:
  name: Merge NILM signatures
  description: Merge two experimental NILM signatures that represent the same load.
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured circuit identifier, such as fridge or mains.
      required: true
      example: mains
      selector:
        text:
    source_signature_id:
      name: Source Signature ID
      description: Signature identifier to merge into the target signature.
      required: true
      example: signature_2
      selector:
        text:
    target_signature_id:
      name: Target Signature ID
      description: Signature identifier that should keep the merged history.
      required: true
      example: signature_1
      selector:
        text:
