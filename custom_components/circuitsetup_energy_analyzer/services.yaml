set_energy_usage_settings:
  name: Set energy usage settings
  description: "Advanced/script action: set daily energy usage spike tracking for one configured circuit. The normal user path is Advanced Circuit Settings."
  fields:
    circuit_id:
      name: Circuit ID
      description: Optional configured circuit identifier, such as fridge or mains. You can choose an analyzer entity instead.
      required: false
