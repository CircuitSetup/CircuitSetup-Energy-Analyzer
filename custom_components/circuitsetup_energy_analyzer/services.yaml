        text:
    entity_id:
      name: Analyzer Entity
      description: Optional analyzer entity for the circuit, such as a health summary sensor, running binary sensor, control button, select, or number entity.
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - button
            - select
            - number
    preset:
      name: Preset
      description: Alert sensitivity preset for the circuit.
      required: true
      example: balanced
      selector:
        select:
          options:
            - value: quiet
