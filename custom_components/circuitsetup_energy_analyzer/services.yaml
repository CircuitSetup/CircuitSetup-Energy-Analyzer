      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - button
            - select
            - number
    window_days:
      name: Window Days
      description: Rolling energy baseline window in days for the circuit.
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 60
          mode: box
    daily_spike_ratio:
      name: Daily Spike Ratio
      description: Daily usage share that can trigger a possible-issue alert.
      required: false
      example: 0.25
      selector:
        number:
          min: 0.01
          max: 1
          step: 0.01
          mode: box
