      selector:
        text:
    assignment_id:
      name: Assignment ID
      description: NILM appliance assignment losing the helper evidence.
      required: true
      selector:
        text:
    helper_circuit_id:
      name: Helper circuit ID
      description: Configured helper circuit relationship to remove.
      required: true
      selector:
