mark_circuit_mixed:
  name: Mark circuit mixed
  description: "Advanced/script action: confirm that a circuit supplies multiple appliances and remove direct-appliance state. The normal user path is the evidence panel's This circuit powers other loads action."
  fields:
    circuit_id:
      name: Circuit ID
      description: Circuit to classify as mixed.
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Optional analyzer config entry to target when circuit IDs are duplicated. Panel actions include this automatically.
      required: false
      selector:
        text:

relearn_baseline:
  name: Relearn baseline
  description: "Advanced/script action: relearn the baseline for a configured circuit. The normal user path is the circuit Relearn Baseline button entity."
  fields:
    circuit_id:
      name: Circuit ID
      description: Optional configured circuit identifier, such as fridge or mains. You can choose an analyzer entity instead.
      required: false
      example: fridge
      selector:
        text:
    entity_id:
      name: Analyzer Entity
      description: Optional analyzer entity for the circuit, such as a health summary sensor, running binary sensor, control button, select, number, or switch entity.
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - button
            - select
            - number
            - switch
pause_alerts:
  name: Pause alerts
  description: "Advanced/script action: pause alert notifications for a configured circuit. The normal user path is the circuit Pause alerts switch entity."
  fields:
    circuit_id:
      name: Circuit ID
      description: Optional configured circuit identifier, such as fridge or mains. You can choose an analyzer entity instead.
      required: false
      example: fridge
      selector:
        text:
    entity_id:
      name: Analyzer Entity
      description: Optional analyzer entity for the circuit, such as a health summary sensor, running binary sensor, control button, select, number, or switch entity.
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - button
            - select
            - number
            - switch
    duration:
      name: Duration
      description: How long alert notifications should stay paused.
      required: false
      example: "01:00:00"
      selector:
        text:
acknowledge_alert:
  name: Acknowledge alert
  description: "Advanced/script action: acknowledge an alert evidence notification. The normal user path is the Acknowledge button in the evidence panel."
  fields:
    alert_id:
      name: Alert ID
      description: Optional alert identifier from the alert evidence notification. If omitted, choose an analyzer entity for a circuit with exactly one active alert.
      required: false
      example: circuitsetup_energy_analyzer_alert_fridge_cycle_duration_s
      selector:
        text:
    entity_id:
      name: Analyzer Entity
      description: Optional analyzer entity for a circuit with exactly one active alert.
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - button
            - select
            - number
