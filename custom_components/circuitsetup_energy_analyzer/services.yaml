set_nilm_helper_link:
  name: Set NILM helper link
  description: 'Advanced/script action: confirm a configured circuit as evidence for one NILM appliance assignment. The normal user path is the NILM workspace panel.'
  fields:
    circuit_id:
      name: Circuit ID
      description: Configured Load Separation source circuit identifier.
      required: true
      selector:
        text:
    assignment_id:
      name: Assignment ID
      description: NILM appliance assignment receiving the helper evidence.
      required: true
      selector:
        text:
    helper_circuit_id:
      name: Helper circuit ID
      description: Configured circuit providing the helper evidence.
      required: true
      selector:
        text:
    relationship:
      name: Relationship
      description: Evidence only corroborates the estimate; direct component means the circuit directly measures load included in the source.
      required: true
      selector:
        select:
          options:
            - label: Runs with this load (evidence only)
              value: corroborates
            - label: Directly measures this load (included in source)
              value: direct_component
    entry_id:
      name: Entry ID
      description: Optional config entry that owns the source and helper circuits.
      required: false
      selector:
        text:
remove_nilm_helper_link:
  name: Remove NILM helper link
  description: 'Advanced/script action: remove a confirmed circuit relationship from one NILM appliance assignment. The normal user path is the NILM workspace panel.'
  fields:
