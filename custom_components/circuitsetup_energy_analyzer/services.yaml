set_circuit_sensitivity:
  name: Set circuit sensitivity
  description: "Advanced/script action: set the alert sensitivity preset for one configured circuit. The normal user path is the circuit Alert Sensitivity select entity."
  fields:
    circuit_id:
      name: Circuit ID
      description: Optional configured circuit identifier, such as fridge or mains. You can choose an analyzer entity instead.
      required: false
